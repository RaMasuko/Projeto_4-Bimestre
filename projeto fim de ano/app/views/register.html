<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cadastro - Pokémon Decks</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
</head>
<body class="auth-page">
    <div class="auth-card">
        <div class="auth-header">
            <div class="pokeball-icon"></div>
            <h2>Novo Treinador</h2>
            <p>Crie sua conta para montar e gerenciar seus baralhos</p>
        </div>

        {% with messages = get_flashed_messages(with_categories=true) %}
          {% if messages %}
            <div class="alert-container">
            {% for category, message in messages %}
              <div class="alert {{ category if category else 'error' }}">{{ message }}</div>
            {% endfor %}
            </div>
          {% endif %}
        {% endwith %}

        <form method="POST" action="{{ url_for('auth.register') }}" class="auth-form">
            <div class="form-group">
                <label for="username">Nome de Usuário</label>
                <input type="text" id="username" name="username" placeholder="Escolha um nome de usuário" required autofocus>
            </div>
            
            <div class="form-group">
                <label for="password">Senha</label>
                <input type="password" id="password" name="password" placeholder="Digite sua senha" required>
            </div>

            <div class="form-group">
                <label for="confirm_password">Confirmar Senha</label>
                <input type="password" id="confirm_password" name="confirm_password" placeholder="Repita a senha" required>
            </div>
            
            <button type="submit" class="btn btn-primary">Cadastrar Conta</button>
        </form>

        <div class="auth-footer">
            <p>Já possui uma conta? <a href="{{ url_for('auth.login') }}">Faça o Login</a></p>
        </div>
    </div>
</body>
</html>
