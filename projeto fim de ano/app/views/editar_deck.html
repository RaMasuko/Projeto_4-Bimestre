<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Editar Baralho - Pokémon Decks</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
</head>
<body class="auth-page">
    <div class="auth-card form-card-wide">
        <div class="auth-header">
            <div class="pokeball-icon"></div>
            <h2>Editar Baralho</h2>
            <p>Atualize as informações e a lista do seu baralho</p>
        </div>

        {% with messages = get_flashed_messages(with_categories=true) %}
          {% if messages %}
            <div class="alert-container">
            {% for category, message in messages %}
              <div class="alert {{ category if category else 'error' }}">{{ message }}</div>
            {% endfor %}
            </div>
          {% endif %}
        {% endwith %}

        <form method="POST" action="{{ url_for('deck.edit', deck_id=deck.id) }}" class="auth-form">
            <div class="form-group">
                <label for="name">Nome do Baralho *</label>
                <input type="text" id="name" name="name" value="{{ deck.name }}" required autofocus>
            </div>
            
            <div class="form-group">
                <label for="carta_principal">Carta Principal</label>
                <input type="text" id="carta_principal" name="carta_principal" value="{{ deck.carta_principal if deck.carta_principal else '' }}">
            </div>

            <div class="form-group">
                <label for="lista_baralho">Lista do Baralho (Cartas)</label>
                <textarea id="lista_baralho" name="lista_baralho" rows="6">{{ deck.lista_baralho if deck.lista_baralho else '' }}</textarea>
            </div>
            
            <button type="submit" class="btn btn-primary">Salvar Alterações</button>
            <a href="{{ url_for('deck.index') }}" class="btn btn-logout" style="text-align: center; margin-top: 0.5rem;">Cancelar</a>
        </form>
    </div>
</body>
</html>
